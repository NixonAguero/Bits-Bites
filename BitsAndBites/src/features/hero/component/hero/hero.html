@if (responsive.isMobile()){
    <div class="dark-background hero-container">
        <div class="hero-content">
            <p class="p-figma">High-altitude gastronomy</p>
            <hr class="hr-titulo">
            <h1 class="title">Cremas de Pejibaye</h1>
        </div>
        <img class="leaf-left" src="assets/verticalLeaf.png" alt="leaf top-left">
        <img class="leaf-left" src="assets/horizontalLeafs.png" alt="horizontal leaves">
        <img class="leaf-right" src="assets/verticalLeaf.png" alt="leaf top-right">
        <img class="leaf-right" src="assets/horizontalLeafs.png" alt="horizontal leaves">
    </div>
} @else {
    <div class="dark-background hero-desktop">
        <div class="hero-left">
            <img class="leaf-top-left" src="assets/verticalLeaf.png" alt="leaf top-left">
            <div class="hero-content">
                <p class="p-figma">High-altitude gastronomy</p>
                <hr class="hr-titulo">
                <h1 class="title">Cremas de Pejibaye</h1>
            </div>
            <img class="leaf-left" src="assets/horizontalLeafs.png" alt="horizontal leaves">
        </div>
        <div class="hero-right">
            <img class="hero-photo" src="assets/RompopeVaso.png" alt="Crema de Pejibaye served in a glass with a straw and a garnish of cinnamon on top">
        </div>
    </div>
}
