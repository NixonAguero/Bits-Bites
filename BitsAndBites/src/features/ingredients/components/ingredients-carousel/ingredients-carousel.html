<section class="ingredients-section">
    <h1 class="titles">Ingredients</h1>

    <div class="carousel">
        <button class="carousel-btn prev" (click)="prev()">&#8249;</button>

        <div class="cards-track">
            @for (ingredient of visibleCards(); track ingredient.name; let i = $index) {
                <app-ingredient-card
                    [ingredient]="ingredient"
                    [color]="colors[(currentIndex() + i) % colors.length]"
                ></app-ingredient-card>
            }
        </div>

        <button class="carousel-btn next" (click)="next()">&#8250;</button>
    </div>

    <div class="dots">
        @for (dot of dots; track dot) {
            <span class="dot" [class.active]="dot === activeDot"></span>
        }
    </div>
</section>
