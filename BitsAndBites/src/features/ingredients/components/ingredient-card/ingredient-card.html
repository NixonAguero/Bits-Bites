<div class="ingredient-card" [style.background-color]="color()">
    <div class="card-body">
        <h3 class="card-name">{{ ingredient().name }}</h3>
        <hr class="separator">
        <span class="card-amount">{{ ingredient().amount }}</span>
        <p class="card-description">{{ ingredient().description }}</p>
    </div>
</div>
